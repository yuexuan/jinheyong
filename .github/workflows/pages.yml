name: Publish Blog

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache-

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure target repository credentials
        shell: bash
        run: |
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "::error::Repository secret ACCESS_TOKEN is not configured."
            exit 1
          fi
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Publish to yuexuan.github.io
        run: npm run adeploy
