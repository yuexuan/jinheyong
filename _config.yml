# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 今何用
subtitle: '金融学习 · 量化研究 · 技术实践 · 个人思考'
description: '记录金融学习、量化研究、技术实践与个人思考。记录判断，也记录判断如何改变。'
keywords: 金融学习, 量化研究, 投资笔记, 宏观经济, A股, Alpha, AI, 软件工程, 个人思考
author: 今何用
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://yuexuan.github.io
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

abbrlink:
  alg: crc32
  rep: hex
  drafts: false
  auto_category:
     enable: true
     depth:
     over_write: false
  auto_title: false
  auto_date: false
  force: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo:
    github:
      url: https://github.com/yuexuan/yuexuan.github.io.git
      branch: master
  name: GitHubAction
  email: github-actions[bot]@users.noreply.github.com
  ignore_hidden: false

search:
  path: search.xml
  field: post
  content: true
  format: html

sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  rel: false
  tags: true
  categories: true

nofollow:
  enable: true
  field: site
  exclude:

markdown:
  plugins:
    - '@renbaoshuo/markdown-it-katex'

douban:
  id: 48279108
  builtin: false
  item_per_page: 20
  meta_max_line: 4
  customize_layout: page
  book:
    path: books/index.html
    title: '豆瓣读书'
    quote: '好书分享'
    option:
      aside: false
      comments: false
  movie:
    path: movies/index.html
    title: '豆瓣电影'
    quote: '好电影一生相随'
    option:
      aside: false
      comments: false
  game:
    path: games/index.html
    title: '豆瓣游戏'
    quote: '体验游戏，开发游戏'
    option:
      aside: false
      comments: false
  timeout: 10000
